<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>getUserMedia Test</title>
  <style>body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:20px}video{max-width:100%;border:1px solid #ccc;border-radius:6px}</style>
</head>
<body>
  <h2>Camera access test</h2>
  <p>Click the button to request camera access. If the prompt appears, choose "Allow".</p>
  <button id="start">Start camera</button>
  <button id="stop" disabled>Stop camera</button>
  <p id="status">Status: idle</p>
  <video id="video" autoplay playsinline></video>
  <pre id="out" style="background:#f7f7f7;padding:10px;border-radius:6px;margin-top:12px;max-height:240px;overflow:auto"></pre>
  <script>
    const start = document.getElementById('start')
    const stop = document.getElementById('stop')
    const status = document.getElementById('status')
    const out = document.getElementById('out')
    const video = document.getElementById('video')
    let stream = null

    function log(...args){ out.textContent += JSON.stringify(args, null, 2) + '\n' }

    start.addEventListener('click', async ()=>{
      status.textContent = 'Status: requesting camera...'
      try{
        stream = await navigator.mediaDevices.getUserMedia({ video: true })
        video.srcObject = stream
        status.textContent = 'Status: streaming'
        start.disabled = true
        stop.disabled = false
        log('got stream', stream.id || '(no id)')
      }catch(e){
        console.error(e)
        status.textContent = 'Status: error - ' + (e.name || e.message || e)
        log('error', { name: e.name, message: e.message })
      }
    })

    stop.addEventListener('click', ()=>{
      if(stream){
        stream.getTracks().forEach(t=>t.stop())
        stream = null
        video.srcObject = null
        status.textContent = 'Status: stopped'
        start.disabled = false
        stop.disabled = true
        log('stopped')
      }
    })
  </script>
</body>
</html>
